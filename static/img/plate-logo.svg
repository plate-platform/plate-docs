<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square — matches shell's `w-10 h-10 rounded-xl bg-indigo-600` -->
  <rect x="0" y="0" width="40" height="40" rx="10" ry="10"
        fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="0" y="0" width="40" height="20" rx="10" ry="10"
        fill="url(#shine)"/>

  <!-- Bold "P" — matches shell's `text-white font-bold text-lg` -->
  <text x="10" y="29"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="26"
        fill="white">P</text>

  <!-- Wordmark "Plate" -->
  <text x="51" y="26"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-weight="700"
        font-size="20"
        letter-spacing="-0.4"
        fill="#f1f5f9">Plate</text>
</svg>
